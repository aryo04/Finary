name: cakeu
description: "Finary — Aplikasi pencatatan keuangan pribadi berbasis AI."
publish_to: 'none'

version: 1.0.0+5

environment:
  sdk: ^3.13.1

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # Supabase SDK
  supabase_flutter: ^2.9.0

  # Navigation
  go_router: ^14.8.1

  # State Management
  provider: ^6.1.5

  # Image Picker (Receipt Scanning)
  image_picker: ^1.1.2

  # UI & Fonts
  google_fonts: ^6.2.1
  flutter_svg: ^2.0.17

  # Security & Zero-Knowledge Encryption (Pure Dart AES-256)
  encrypt: ^5.0.3
  crypto: ^3.0.6
  local_auth: ^2.3.0

  # Utilities
  intl: ^0.19.0
  shared_preferences: ^2.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
    - assets/animations/
